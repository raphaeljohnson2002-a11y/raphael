<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Alive Educational Complex</title>

    <link rel="stylesheet" href="/html/school website/myschool.css">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <h1>Alive Educational Complex</h1>

            <p>Student Portal Login</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">

                        👁

                    </button>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>
                
            </form>

            <div class="login-links">

                <a href="#">
                    Forgot Password?
                </a>

                <a href="#">
                    Register
                </a>

            </div>

            <p id="message"></p>

        </div>

    </div>

    <script src="/html/school website/js/login.js"></script>

</body>

</html>
